<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My useful links page</title>


<head>
    <title>HTML Links Examples</title>
</head>
<body>

    <h1>HTML Links Examples</h1>
    <h2>Relative Links</h2>
    <a href="about.html">About Us</a>
    <br>
    <a href="contact.html">Contact Us</a>

    
    <h2>Absolute Links</h2>
    <a href="https://www.google.com">Google</a>
    <br>
    <a href="https://www.wikipedia.org">Wikipedia</a>

    
    <h2>Open Link in New Tab</h2>
    <a href="https://www.youtube.com" target="_blank"
       rel="noopener noreferrer">YouTube</a>

    
    <h2>Email Link</h2>
    <a href="mailto:example@gmail.com">Send Email</a>

   
    <h2>Telephone Link</h2>
    <a href="tel:+911234567890">Call Us</a>

   
    <h2>Bookmark Link</h2>
    <a href="#bottom">Go to Bottom Section</a>

    <br><br><br><br><br>

    <h2 id="bottom">Welcome to the Bottom Section!</h2>
    <p>You have reached the bottom of the page.</p>

</body>
</html>

    
</body>
</html>
